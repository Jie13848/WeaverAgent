<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Drop Shadow for the Lens -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <!-- Clip Path for inside the lens -->
    <clipPath id="lensClip">
      <circle cx="220" cy="150" r="85" />
    </clipPath>
  </defs>

  <!-- Background (Optional, kept transparent for versatility) -->
  <rect width="950" height="300" fill="transparent" />

  <!-- ========================================== -->
  <!-- LEFT SIDE: THE ICON                        -->
  <!-- ========================================== -->

  <!-- 1. The Weaver (Single Data Stream / Ribbon outside) -->
  <!-- Main thick ribbon -->
  <path d="M 30 140 C 70 80, 130 100, 180 135 C 150 165, 90 220, 30 140 Z" fill="url(#streamGrad)" opacity="0.9"/>
  <!-- Secondary flowing ribbon -->
  <path d="M 45 170 Q 90 220, 140 160 T 200 155" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- Third accent ribbon -->
  <path d="M 60 110 Q 110 90, 160 140" fill="none" stroke="#93C5FD" stroke-width="8" stroke-linecap="round"/>

  <!-- 2. The Lens / Portal (The Mirror equivalent) -->
  <!-- Outer Frame with shadow -->
  <circle cx="220" cy="150" r="90" fill="url(#lensGrad)" stroke="#94A3B8" stroke-width="6" filter="url(#shadow)" />
  <!-- Inner Rim (Glass reflection effect) -->
  <circle cx="220" cy="150" r="82" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8" />
  <circle cx="220" cy="150" r="85" fill="none" stroke="#CBD5E1" stroke-width="1" />

  <!-- 3. The Agent Network (The School of Fish equivalent inside the lens) -->
  <g clip-path="url(#lensClip)">
    <!-- Network Lines (Weaving pattern) -->
    <path d="M 170 145 Q 210 110, 250 130 T 310 120" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M 180 155 Q 220 180, 260 150 T 300 160" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
    <path d="M 190 130 Q 230 90,  270 110 T 310 90"  fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M 185 170 Q 210 210, 250 180 T 290 190" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 120 L 230 160 L 270 140" fill="none" stroke="#BFDBFE" stroke-width="2" />
    <path d="M 240 135 L 260 170" fill="none" stroke="#BFDBFE" stroke-width="2" />

    <!-- Network Nodes (Glowing dots) -->
    <circle cx="210" cy="125" r="4" fill="#1D4ED8" />
    <circle cx="250" cy="130" r="5" fill="#1E40AF" />
    <circle cx="285" cy="123" r="3" fill="#3B82F6" />
    
    <circle cx="220" cy="165" r="4" fill="#2563EB" />
    <circle cx="260" cy="150" r="6" fill="#1D4ED8" />
    <circle cx="295" cy="158" r="4" fill="#60A5FA" />
    
    <circle cx="230" cy="103" r="3" fill="#93C5FD" />
    <circle cx="270" cy="110" r="4" fill="#3B82F6" />
    
    <circle cx="210" cy="190" r="3" fill="#60A5FA" />
    <circle cx="250" cy="180" r="4" fill="#2563EB" />
    <circle cx="280" cy="188" r="3" fill="#93C5FD" />
  </g>

  <!-- ========================================== -->
  <!-- MIDDLE: SEPARATOR                          -->
  <!-- ========================================== -->
  <line x1="360" y1="90" x2="360" y2="210" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

  <!-- ========================================== -->
  <!-- RIGHT SIDE: TYPOGRAPHY                     -->
  <!-- ========================================== -->
  <!-- Main Text -->
  <text x="400" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" fill="#5A6577" letter-spacing="-1">
    WeaverAgent
  </text>

  <!-- Subtle graphic under text (Mirroring the wave under 'ro' in MiroFish) -->
  <!-- Placed under 'ver' to emphasize the 'Weaver' aspect -->
  <path d="M 545 195 Q 560 185, 575 195 T 605 195" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>

</svg>